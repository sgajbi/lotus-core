services:
  kafka:
    # Validation-only fault injection: force the former ten-probe budget to expire, then execute
    # the unchanged real broker probe. The base Compose file remains the authority for retries.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          attempt=$$(cat /tmp/lotus-kafka-health-attempt 2>/dev/null || echo 0);
          attempt=$$((attempt + 1));
          echo "$$attempt" > /tmp/lotus-kafka-health-attempt;
          if [ "$$attempt" -le 10 ]; then exit 1; fi;
          kafka-topics --bootstrap-server kafka:9093 --list || exit 1
      interval: 5s
      timeout: 5s
      start_period: 0s
