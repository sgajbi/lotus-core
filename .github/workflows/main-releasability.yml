name: Main Releasability Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional merged pull-request SHA that this run must validate."
        required: false
        type: string
      triggering_pr:
        description: "Optional pull request number that dispatched this mainline validation."
        required: false
        type: string
      run_institutional_completion:
        description: "Run the approval-grade 1000-portfolio institutional completion and sign-off jobs."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.expected_sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  exact-revision-assertion:
    name: Main Releasability / Exact Revision Assertion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert expected merged PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No expected_sha input supplied; treating this as an operator-dispatched main releasability run."
            exit 0
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Main releasability checkout SHA $actual_sha does not match expected merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::Expected SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown} is not reachable from origin/main."
            exit 1
          fi

  workflow-lint:
    name: Main Releasability / Workflow Lint
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  windows-lock-closures:
    name: Main Releasability / Windows Lock Closure Replay
    needs: [exact-revision-assertion]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Replay Windows runtime closure
        run: python scripts/development/update_shared_runtime_lock.py --check --platform windows
      - name: Replay Windows CI tooling closure
        run: python scripts/development/update_ci_tooling_lock.py --check --platform windows

  lint-typecheck-contracts-security:
    name: Main Releasability / Lint Typecheck Contracts Security
    needs: [windows-lock-closures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Verify Dependencies
        run: make verify-dependencies-clean
      - name: Replay Linux dependency lock closures
        run: make dependency-lock-replay-check
      - name: Generate Dependency Technology Evidence
        run: make dependency-technology-inventory
      - name: Lint
        run: make lint
      - name: Verify live required status checks
        env:
          GH_TOKEN: ${{ secrets.LOTUS_BRANCH_PROTECTION_READ_TOKEN }}
        run: make required-status-checks-live-guard
      - name: Verify Technology Governance Receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: make technology-governance-pilot-receipt-guard
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: Typecheck
        run: make typecheck
      - name: Architecture Guard
        run: make architecture-guard
      - name: Verify Base Image Registry Evidence
        run: make base-image-registry-evidence-check
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Security Audit
        run: make security-audit
      - name: Upload dependency health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-dependency-health-${{ github.run_id }}
          path: output/dependency-health/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload dependency technology evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-dependency-technology-${{ github.run_id }}
          path: output/dependency-technology/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Warning Gate
        run: make warning-gate

  test-suites:
    name: Main Releasability / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-contracts-security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            target: test-unit
          - suite: unit-db
            target: test-unit-db
          - suite: critical-lifecycle-db
            target: test-critical-lifecycle-db
          - suite: integration-lite
            target: test-integration-lite
          - suite: ops-contract
            target: test-ops-contract
          - suite: transaction-buy-contract
            target: test-transaction-buy-contract
          - suite: transaction-sell-contract
            target: test-transaction-sell-contract
          - suite: transaction-dividend-contract
            target: test-transaction-dividend-contract
          - suite: transaction-interest-contract
            target: test-transaction-interest-contract
          - suite: transaction-fx-contract
            target: test-transaction-fx-contract
          - suite: transaction-portfolio-flow-bundle-contract
            target: test-transaction-portfolio-flow-bundle-contract
          - suite: transaction-processing-contract
            target: test-transaction-processing-contract
    steps:
      - uses: actions/checkout@v6
        if: matrix.suite != 'unit'
      - uses: actions/checkout@v6
        if: matrix.suite == 'unit'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run ${{ matrix.suite }}
        run: make ${{ matrix.target }}

  coverage-gate:
    name: Main Releasability / Coverage Gate (Combined)
    needs: [test-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Enforce combined coverage threshold
        env:
          LOTUS_COVERAGE_CHANGED_BASE: HEAD~1
        run: make coverage-gate

  docker-build:
    name: Main Releasability / Validate Docker Build
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install CI tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-tooling.lock.txt
      - name: Restore Docker build cache
        uses: actions/cache@v5
        with:
          path: .buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker-compose.yml', 'requirements/shared-runtime.lock.txt', 'src/**/Dockerfile', 'src/**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build exact-source runtime image set
        shell: bash
        env:
          LOTUS_RUNTIME_IMAGE_SET_GROUP: main-runtime-image-set
          LOTUS_RUNTIME_IMAGE_SET_SOURCE_COMMIT_SHA: ${{ github.sha }}
          LOTUS_RUNTIME_IMAGE_SET_SOURCE_BRANCH: ${{ github.ref_name }}
          LOTUS_RUNTIME_IMAGE_SET_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          LOTUS_RUNTIME_IMAGE_SET_CI_RUN_ID: ${{ github.run_id }}
        run: make build-runtime-image-set
      - name: Generate runtime SBOM
        run: |
          python scripts/release/generate_runtime_sbom.py --output output/build-evidence/shared-runtime-sbom.cdx.json
      - name: Write build provenance manifest
        run: |
          python scripts/release/write_build_provenance.py --dockerfile src/services/query_service/Dockerfile --image-tag lotus-core/query-service:local --output output/build-evidence/query-service-provenance.json
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-docker-build-evidence
          path: |
            output/build-evidence/*
            output/runtime-image-set/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload runtime image set
        uses: actions/upload-artifact@v7
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  docker-smoke-contract:
    name: Main Releasability / Docker Smoke Contract
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set
      - name: Install
        run: make install-ci
      - name: Run deterministic docker endpoint smoke
        run: make test-docker-smoke
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-docker-smoke-artifacts
          path: |
            output/task-runs/*.json
            output/task-runs/*.md
            output/task-runs/diagnostics/docker-smoke-compose.log
          if-no-files-found: warn
          retention-days: 30

  latency-gate:
    name: Main Releasability / Latency Gate
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set
      - name: Install
        run: make install-ci
      - name: Run endpoint latency gate
        env:
          DEMO_DATA_PACK_HISTORY_DAYS: "240"
          DEMO_DATA_PACK_PORTFOLIO_IDS: "DEMO_DPM_EUR_001"
          DEMO_DATA_PACK_INGEST_ONLY: "true"
        run: make test-latency-gate
      - name: Upload latency artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-latency-artifacts
          path: |
            output/task-runs/*latency-profile*.json
            output/task-runs/*latency-profile*.md
            output/task-runs/diagnostics/latency-gate-compose.log
          if-no-files-found: warn
          retention-days: 30

  performance-load-gate:
    name: Main Releasability / Performance Load Gate (Fast)
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set
      - name: Install
        run: make install-ci
      - name: Run deterministic performance load gate
        run: make test-performance-load-gate
      - name: Upload performance load artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-performance-load-artifacts
          path: |
            output/task-runs/*performance-load-gate*.json
            output/task-runs/*performance-load-gate*.md
            output/task-runs/diagnostics/performance-load-gate-compose.log
          if-no-files-found: warn
          retention-days: 30

  integration-all:
    name: Main Releasability / Integration Full
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run full integration suite
        env:
          LOTUS_TESTS_COMPOSE_LOG_FILE: output/integration-all/integration-all-compose.log
        run: make test-integration-all
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-integration-all-artifacts
          path: output/integration-all/integration-all-compose.log
          if-no-files-found: warn
          retention-days: 30

  e2e-all:
    name: Main Releasability / E2E Full
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set
      - name: Install
        run: make install-ci
      - name: Run full E2E suite
        env:
          LOTUS_TEST_ENV_PROFILE: e2e
          E2E_INGESTION_URL: http://localhost:8400
          E2E_QUERY_URL: http://localhost:8401
          HOST_DATABASE_URL: postgresql://user:password@localhost:57432/portfolio_db
          LOTUS_TESTS_COMPOSE_LOG_FILE: output/e2e-all/e2e-all-compose.log
        run: make test-e2e-all
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-e2e-diagnostics
          path: output/e2e-all/e2e-all-compose.log
          if-no-files-found: warn
          retention-days: 30

  performance-load-gate-full:
    name: Main Releasability / Performance Load Gate (Full)
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set
      - name: Install
        run: make install-ci
      - name: Run deterministic full performance load gate
        run: make test-performance-load-gate-full
      - name: Upload full performance load artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-performance-load-full-artifacts
          path: |
            output/task-runs/*performance-load-gate*.json
            output/task-runs/*performance-load-gate*.md
            output/task-runs/diagnostics/performance-load-gate-compose.log
          if-no-files-found: warn
          retention-days: 30

  failure-recovery-gate:
    name: Main Releasability / Failure Recovery Gate
    needs: [docker-build, performance-load-gate-full]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set
      - name: Install
        run: make install-ci
      - name: Run deterministic failure recovery gate
        run: make test-failure-recovery-gate
      - name: Run fixed-income book-cost recovery gate
        run: make test-fixed-income-book-cost-recovery-gate
      - name: Run deterministic derived-state recovery gate
        run: make test-derived-state-recovery-gate
      - name: Upload failure recovery artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-failure-recovery-artifacts
          path: |
            output/task-runs/*failure-recovery-gate*.json
            output/task-runs/*failure-recovery-gate*.md
            output/task-runs/diagnostics/failure-recovery-gate-compose.log
            output/task-runs/*derived-state-recovery-gate*.json
            output/task-runs/*derived-state-recovery-gate*.md
            output/task-runs/diagnostics/derived-state-recovery-gate-compose.log
          if-no-files-found: warn
          retention-days: 30

  institutional-completion-gate:
    name: Main Releasability / Institutional Completion Gate
    # This approval-grade 1000-portfolio / 100k-transaction bank-day run is
    # intentionally opt-in. The faster main releasability gates remain the
    # routine post-merge signal; release candidates can enable this input when
    # institutional sign-off evidence is explicitly required.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_institutional_completion }}
    needs: [docker-build, failure-recovery-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: main-runtime-image-set
          path: output/runtime-image-set
      - name: Install
        run: make install-ci
      - name: Run governed institutional completion gate
        run: make test-institutional-completion-gate
      - name: Upload institutional completion artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-institutional-completion-artifacts
          path: |
            output/task-runs/*bank-day-load*.json
            output/task-runs/*bank-day-load*.md
            output/task-runs/diagnostics/institutional-completion-compose.log
          if-no-files-found: warn
          retention-days: 30

  institutional-signoff-pack:
    name: Main Releasability / Institutional Sign-Off Pack
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_institutional_completion }}
    needs:
      [docker-smoke-contract, latency-gate, performance-load-gate, failure-recovery-gate, institutional-completion-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Download sign-off artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: output/task-runs
      - name: Generate institutional sign-off pack
        run: make test-institutional-signoff-pack
      - name: Upload institutional sign-off artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-institutional-signoff-artifacts
          path: |
            output/task-runs/*-institutional-signoff-pack.json
            output/task-runs/*-institutional-signoff-pack.md
          if-no-files-found: error
          retention-days: 30
