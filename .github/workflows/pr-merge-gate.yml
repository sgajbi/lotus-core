name: Pull Request Merge Gate

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: enforce
        uses: reviewdog/action-actionlint@v1

  windows-lock-closures:
    name: PR Merge Gate / Windows Lock Closure Replay
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Replay Windows runtime closure
        run: python scripts/development/update_shared_runtime_lock.py --check --platform windows
      - name: Replay Windows CI tooling closure
        id: enforce
        shell: bash
        run: python scripts/development/update_ci_tooling_lock.py --check --platform windows

  lint-typecheck-contracts-security:
    name: PR Merge Gate / Lint Typecheck Contracts Security
    needs: [windows-lock-closures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Resolve dependency health cache key
        id: dependency-health-cache-key
        run: |
          key="$(python scripts/validation/dependency_health_check.py --print-cache-key)"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore dependency health cache
        id: dependency-health-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/dependency-health
          key: dependency-health-${{ runner.os }}-${{ steps.dependency-health-cache-key.outputs.key }}
      - name: Verify Dependencies
        run: make verify-dependencies
      - name: Replay Linux dependency lock closures
        run: make dependency-lock-replay-check
      - name: Save verified dependency health cache
        if: steps.dependency-health-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/dependency-health
          key: dependency-health-${{ runner.os }}-${{ steps.dependency-health-cache-key.outputs.key }}
      - name: Generate Dependency Technology Evidence
        run: make dependency-technology-inventory
      - name: Lint
        run: make lint
      - name: Verify Technology Governance Receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: make technology-governance-pilot-receipt-guard
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: Typecheck
        run: make typecheck
      - name: Architecture Guard
        run: make architecture-guard
      - name: Verify Base Image Registry Evidence
        run: make base-image-registry-evidence-check
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Security Audit
        run: make security-audit
      - name: Upload dependency health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-dependency-health-${{ github.run_id }}
          path: output/dependency-health/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dependency technology evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-dependency-technology-${{ github.run_id }}
          path: output/dependency-technology/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Warning Gate
        id: enforce
        shell: bash
        run: make warning-gate

  test-suites:
    name: PR Merge Gate / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-contracts-security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            target: test-unit
          - suite: unit-db
            target: test-unit-db
          - suite: critical-lifecycle-db
            target: test-critical-lifecycle-db
          - suite: integration-lite
            target: test-integration-lite
          - suite: ops-contract
            target: test-ops-contract
          - suite: transaction-buy-contract
            target: test-transaction-buy-contract
          - suite: transaction-sell-contract
            target: test-transaction-sell-contract
          - suite: transaction-dividend-contract
            target: test-transaction-dividend-contract
          - suite: transaction-interest-contract
            target: test-transaction-interest-contract
          - suite: transaction-fx-contract
            target: test-transaction-fx-contract
          - suite: transaction-portfolio-flow-bundle-contract
            target: test-transaction-portfolio-flow-bundle-contract
          - suite: transaction-processing-contract
            target: test-transaction-processing-contract
    steps:
      - uses: actions/checkout@v6
        if: matrix.suite != 'unit'
      - uses: actions/checkout@v6
        if: matrix.suite == 'unit'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run ${{ matrix.suite }}
        id: enforce
        shell: bash
        run: make ${{ matrix.target }}

  coverage-gate:
    name: PR Merge Gate / Coverage Gate (Combined)
    needs: [test-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Enforce combined coverage threshold
        id: enforce
        shell: bash
        env:
          LOTUS_COVERAGE_CHANGED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: make coverage-gate

  docker-build:
    name: PR Merge Gate / Validate Docker Build
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install CI tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-tooling.lock.txt
      - name: Restore Docker build cache
        uses: actions/cache@v5
        with:
          path: .buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker-compose.yml', 'requirements/shared-runtime.lock.txt', 'src/**/Dockerfile', 'src/**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build exact-source runtime image set
        id: enforce
        shell: bash
        env:
          LOTUS_RUNTIME_IMAGE_SET_GROUP: pr-runtime-image-set
          LOTUS_RUNTIME_IMAGE_SET_SOURCE_COMMIT_SHA: ${{ github.sha }}
          LOTUS_RUNTIME_IMAGE_SET_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          LOTUS_RUNTIME_IMAGE_SET_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          LOTUS_RUNTIME_IMAGE_SET_CI_RUN_ID: ${{ github.run_id }}
        run: make build-runtime-image-set
      - name: Generate runtime SBOM
        run: |
          python scripts/release/generate_runtime_sbom.py --output output/build-evidence/shared-runtime-sbom.cdx.json
      - name: Write build provenance manifest
        run: |
          python scripts/release/write_build_provenance.py --dockerfile src/services/query_service/Dockerfile --image-tag lotus-core/query-service:local --output output/build-evidence/query-service-provenance.json
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-docker-build-evidence
          path: |
            output/build-evidence/*
            output/runtime-image-set/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload runtime image set
        uses: actions/upload-artifact@v7
        with:
          name: pr-runtime-image-set
          path: output/runtime-image-set/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  e2e-smoke:
    name: PR Merge Gate / E2E Smoke
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: pr-runtime-image-set
          path: output/runtime-image-set
      - name: Load and verify runtime image set
        run: |
          python scripts/release/runtime_image_set.py load-verify \
            --manifest output/runtime-image-set/manifest.json \
            --bundle output/runtime-image-set/images.tar \
            --expected-commit-sha "${GITHUB_SHA}"
          echo "LOTUS_RUNTIME_IMAGE_SET_VERIFIED=true" >> "${GITHUB_ENV}"
      - name: Install
        run: make install-ci
      - name: Run E2E smoke suite
        id: enforce
        shell: bash
        env:
          LOTUS_TEST_ENV_PROFILE: e2e
          E2E_INGESTION_URL: http://localhost:8400
          E2E_QUERY_URL: http://localhost:8401
          HOST_DATABASE_URL: postgresql://user:password@localhost:57432/portfolio_db
          LOTUS_TESTS_COMPOSE_LOG_FILE: output/e2e-smoke/e2e-smoke-logs.txt
        run: make test-e2e-smoke
      - name: Upload E2E smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-e2e-smoke-artifacts
          path: |
            output/e2e-smoke/*
          if-no-files-found: warn
          retention-days: 14

  docker-smoke-contract:
    name: PR Merge Gate / Docker Smoke Contract
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: pr-runtime-image-set
          path: output/runtime-image-set
      - name: Load and verify runtime image set
        run: |
          python scripts/release/runtime_image_set.py load-verify \
            --manifest output/runtime-image-set/manifest.json \
            --bundle output/runtime-image-set/images.tar \
            --expected-commit-sha "${GITHUB_SHA}"
          echo "LOTUS_RUNTIME_IMAGE_SET_VERIFIED=true" >> "${GITHUB_ENV}"
      - name: Install
        run: make install-ci
      - name: Run deterministic docker endpoint smoke
        id: enforce
        shell: bash
        run: make test-docker-smoke
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-docker-smoke-artifacts
          path: |
            output/task-runs/*.json
            output/task-runs/*.md
            output/task-runs/diagnostics/docker-smoke-compose.log
          if-no-files-found: warn
          retention-days: 14

  lotus-core-validation-report:
    name: PR Merge Gate / Lotus Core Validation Gate
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOTUS_PLATFORM_ROOT: ${{ github.workspace }}/lotus-platform
    steps:
      - uses: actions/checkout@v6
      - name: Check out lotus-platform validation contracts
        uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          path: lotus-platform
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: pr-runtime-image-set
          path: output/runtime-image-set
      - name: Load and verify runtime image set
        run: |
          python scripts/release/runtime_image_set.py load-verify \
            --manifest output/runtime-image-set/manifest.json \
            --bundle output/runtime-image-set/images.tar \
            --expected-commit-sha "${GITHUB_SHA}"
          echo "LOTUS_RUNTIME_IMAGE_SET_VERIFIED=true" >> "${GITHUB_ENV}"
      - name: Install
        run: make install-ci
      - name: Run lotus-core app validation gate
        id: enforce
        shell: bash
        run: make lotus-core-validate
      - name: Upload lotus-core validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-lotus-core-validation-report
          path: |
            output/lotus-core-validation/*.json
            output/lotus-core-validation/*.md
            output/task-runs/diagnostics/*.log
          if-no-files-found: warn
          retention-days: 14

  latency-gate:
    name: PR Merge Gate / Latency Gate
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: pr-runtime-image-set
          path: output/runtime-image-set
      - name: Load and verify runtime image set
        run: |
          python scripts/release/runtime_image_set.py load-verify \
            --manifest output/runtime-image-set/manifest.json \
            --bundle output/runtime-image-set/images.tar \
            --expected-commit-sha "${GITHUB_SHA}"
          echo "LOTUS_RUNTIME_IMAGE_SET_VERIFIED=true" >> "${GITHUB_ENV}"
      - name: Install
        run: make install-ci
      - name: Run endpoint latency gate
        id: enforce
        shell: bash
        env:
          DEMO_DATA_PACK_HISTORY_DAYS: "240"
          DEMO_DATA_PACK_PORTFOLIO_IDS: "DEMO_DPM_EUR_001"
          DEMO_DATA_PACK_INGEST_ONLY: "true"
        run: make test-latency-gate
      - name: Upload latency artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-latency-artifacts
          path: |
            output/task-runs/*latency-profile*.json
            output/task-runs/*latency-profile*.md
            output/task-runs/diagnostics/latency-gate-compose.log
          if-no-files-found: warn
          retention-days: 14

  performance-load-gate:
    name: PR Merge Gate / Performance Load Gate (Fast)
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: pr-runtime-image-set
          path: output/runtime-image-set
      - name: Load and verify runtime image set
        run: |
          python scripts/release/runtime_image_set.py load-verify \
            --manifest output/runtime-image-set/manifest.json \
            --bundle output/runtime-image-set/images.tar \
            --expected-commit-sha "${GITHUB_SHA}"
          echo "LOTUS_RUNTIME_IMAGE_SET_VERIFIED=true" >> "${GITHUB_ENV}"
      - name: Install
        run: make install-ci
      - name: Run deterministic performance load gate
        id: enforce
        shell: bash
        run: make test-performance-load-gate
      - name: Upload performance load artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-performance-load-artifacts
          path: |
            output/task-runs/*performance-load-gate*.json
            output/task-runs/*performance-load-gate*.md
            output/task-runs/diagnostics/performance-load-gate-compose.log
          if-no-files-found: warn
          retention-days: 14

  derived-state-recovery-gate:
    name: PR Merge Gate / Derived-State Recovery Gate
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download runtime image set
        uses: actions/download-artifact@v8
        with:
          name: pr-runtime-image-set
          path: output/runtime-image-set
      - name: Load and verify runtime image set
        run: |
          python scripts/release/runtime_image_set.py load-verify \
            --manifest output/runtime-image-set/manifest.json \
            --bundle output/runtime-image-set/images.tar \
            --expected-commit-sha "${GITHUB_SHA}"
          echo "LOTUS_RUNTIME_IMAGE_SET_VERIFIED=true" >> "${GITHUB_ENV}"
      - name: Install
        run: make install-ci
      - name: Run fixed-income book-cost recovery gate
        run: make test-fixed-income-book-cost-recovery-gate
      - name: Run deterministic derived-state recovery gate
        id: enforce
        shell: bash
        run: make test-derived-state-recovery-gate
      - name: Upload derived-state recovery artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-derived-state-recovery-artifacts
          path: |
            output/task-runs/*derived-state-recovery-gate*.json
            output/task-runs/*derived-state-recovery-gate*.md
            output/task-runs/diagnostics/derived-state-recovery-gate-compose.log
          if-no-files-found: warn
          retention-days: 14
