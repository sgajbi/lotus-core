name: Remote Feature Lane

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

jobs:
  workflow-lint:
    name: Feature Lane / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  windows-lock-closures:
    name: Feature Lane / Windows Lock Closure Replay
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Replay Windows runtime closure
        run: python scripts/development/update_shared_runtime_lock.py --check --platform windows
      - name: Replay Windows CI tooling closure
        run: python scripts/development/update_ci_tooling_lock.py --check --platform windows

  lint-typecheck-contracts-security:
    name: Feature Lane / Lint Typecheck Contracts Security
    needs: [windows-lock-closures]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Resolve dependency health cache key
        id: dependency-health-cache-key
        run: make dependency-health-cache-key
      - name: Restore dependency health cache
        id: dependency-health-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/dependency-health
          key: dependency-health-${{ runner.os }}-${{ steps.dependency-health-cache-key.outputs.key }}
      - name: Verify Dependencies
        run: make verify-dependencies
      - name: Replay Linux dependency lock closures
        run: make dependency-lock-replay-check
      - name: Save verified dependency health cache
        if: steps.dependency-health-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/dependency-health
          key: dependency-health-${{ runner.os }}-${{ steps.dependency-health-cache-key.outputs.key }}
      - name: Generate Dependency Technology Evidence
        run: make dependency-technology-inventory
      - name: Lint
        run: make lint
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: Typecheck
        run: make typecheck
      - name: Architecture Guard
        run: make architecture-guard
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Security Audit
        run: make security-audit
      - name: Upload dependency health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-lane-dependency-health-${{ github.run_id }}
          path: output/dependency-health/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dependency technology evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-lane-dependency-technology-${{ github.run_id }}
          path: output/dependency-technology/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Warning Gate
        run: make warning-gate

  test-suites:
    name: Feature Lane / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-contracts-security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit-db
            target: test-unit-db
          - suite: critical-lifecycle-db
            target: test-critical-lifecycle-db
          - suite: integration-lite
            target: test-integration-lite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run ${{ matrix.suite }}
        run: make ${{ matrix.target }}
