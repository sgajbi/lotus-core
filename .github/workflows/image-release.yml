name: Image Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKER_BUILDKIT: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

jobs:
  prepare-image-matrix:
    name: Image Release / Prepare governed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve governed image matrix
        id: matrix
        run: python -m scripts.release.write_image_build_matrix --github-output "$GITHUB_OUTPUT"

  prepare-vulnerability-authority:
    name: Image Release / Prepare vulnerability authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Fetch and bind workflow vulnerability authority
        shell: bash
        run: |
          authority_dir="output/vulnerability-authority"
          bundle_path="${authority_dir}/vulnerability-authority-bundle.json"
          kev_catalog_path="${authority_dir}/cisa-kev.json"
          exception_schema_path="${authority_dir}/vulnerability-exception-register.schema.json"
          mkdir -p "${authority_dir}"
          write_unavailable_receipt() {
            python -m scripts.release.vulnerability_authority_bundle unavailable \
              --bundle "${bundle_path}" \
              --repository "${GITHUB_REPOSITORY}" \
              --git-commit-sha "${GITHUB_SHA}" \
              --ci-run-id "${GITHUB_RUN_ID}" \
              --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --generated-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --reason-code "$1"
          }
          if ! curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-redirs 3 \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --user-agent "lotus-core-image-release/${GITHUB_SHA}" \
            --output "${kev_catalog_path}" \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"; then
            write_unavailable_receipt cisa_kev_fetch_failed
            exit 1
          fi
          kev_fetched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if ! curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-redirs 3 \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --user-agent "lotus-core-image-release/${GITHUB_SHA}" \
            --output "${exception_schema_path}" \
            "https://raw.githubusercontent.com/sgajbi/lotus-platform/2868348d289fc685ecf5a218b6c73256ac3a7742/platform-contracts/vulnerability-exceptions/vulnerability-exception-register.schema.json"; then
            write_unavailable_receipt exception_schema_fetch_failed
            exit 1
          fi
          if ! python -m scripts.release.vulnerability_authority_bundle create \
            --bundle "${bundle_path}" \
            --kev-catalog "${kev_catalog_path}" \
            --exception-schema "${exception_schema_path}" \
            --repository "${GITHUB_REPOSITORY}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --kev-fetched-at "${kev_fetched_at}" \
            --generated-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"; then
            write_unavailable_receipt authority_validation_failed
            exit 1
          fi
      - name: Upload workflow vulnerability authority
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-authority-attempt-${{ github.run_attempt }}
          path: output/vulnerability-authority/
          if-no-files-found: error
          retention-days: 90

  publish-images:
    name: Image Release / Publish ${{ matrix.service }}
    needs: [prepare-image-matrix, prepare-vulnerability-authority]
    if: >-
      ${{ github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-image-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download workflow vulnerability authority
        uses: actions/download-artifact@v8
        with:
          name: vulnerability-authority-attempt-${{ github.run_attempt }}
          path: output/vulnerability-authority
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
      - name: Install Cosign
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Resolve immutable image metadata
        id: meta
        shell: bash
        run: |
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          image_ref="${REGISTRY}/${GITHUB_REPOSITORY}/${{ matrix.image_name }}"
          image_tag="${image_ref}:${GITHUB_SHA}"
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          mkdir -p output/build-evidence
          {
            echo "build_timestamp=${build_timestamp}"
            echo "image_ref=${image_ref}"
            echo "image_tag=${image_tag}"
            echo "repo_url=${repo_url}"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push image by Git SHA
        shell: bash
        run: |
          metadata_file="output/build-evidence/${{ matrix.service }}-buildx-metadata.json"
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ steps.meta.outputs.image_tag }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.ref.name=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.created=${{ steps.meta.outputs.build_timestamp }}" \
            --label "org.opencontainers.image.source=${{ steps.meta.outputs.repo_url }}" \
            --label "org.opencontainers.image.version=${GITHUB_SHA}" \
            --label "org.opencontainers.image.ci.run_id=${GITHUB_RUN_ID}" \
            --build-arg "LOTUS_GIT_COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "LOTUS_GIT_BRANCH=${GITHUB_REF_NAME}" \
            --build-arg "LOTUS_BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}" \
            --build-arg "LOTUS_REPO_URL=${{ steps.meta.outputs.repo_url }}" \
            --build-arg "LOTUS_IMAGE_VERSION=${GITHUB_SHA}" \
            --build-arg "LOTUS_IMAGE_DIGEST=unknown" \
            --build-arg "LOTUS_CI_RUN_ID=${GITHUB_RUN_ID}" \
            --metadata-file "${metadata_file}" \
            --provenance=true \
            --sbom=true \
            --push \
            .
      - name: Resolve pushed image digest
        id: digest
        shell: bash
        run: |
          digest="$(python -c "import json, pathlib; data = json.loads(pathlib.Path('output/build-evidence/${{ matrix.service }}-buildx-metadata.json').read_text()); print(data.get('containerimage.digest', ''))")"
          if [ -z "${digest}" ]; then
            echo "Build metadata did not include containerimage.digest" >&2
            exit 1
          fi
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${{ steps.meta.outputs.image_ref }}@${digest}" > "output/build-evidence/${{ matrix.service }}-digest-ref.txt"
      - name: Generate image vulnerability and secret policy receipt
        shell: bash
        run: |
          scanner_image="aquasec/trivy:0.56.2"
          report_path="output/build-evidence/${{ matrix.service }}-trivy.json"
          receipt_path="output/build-evidence/${{ matrix.service }}-image-scan-policy.json"
          authority_dir="output/vulnerability-authority"
          authority_bundle_path="${authority_dir}/vulnerability-authority-bundle.json"
          kev_catalog_path="${authority_dir}/cisa-kev.json"
          exception_schema_path="${authority_dir}/vulnerability-exception-register.schema.json"
          python -m scripts.release.vulnerability_authority_bundle verify \
            --bundle "${authority_bundle_path}" \
            --kev-catalog "${kev_catalog_path}" \
            --exception-schema "${exception_schema_path}" \
            --repository "${GITHUB_REPOSITORY}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --verified-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          kev_fetched_at="$(python -c "import json, pathlib; print(json.loads(pathlib.Path('${authority_bundle_path}').read_text())['cisa_kev']['fetched_at_utc'])")"
          write_unavailable_receipt() {
            python -m scripts.release.image_scan_policy unavailable \
              --service "${{ matrix.service }}" \
              --image-ref "${{ steps.meta.outputs.image_ref }}" \
              --image-digest "${{ steps.digest.outputs.image_digest }}" \
              --repository "${GITHUB_REPOSITORY}" \
              --git-commit-sha "${GITHUB_SHA}" \
              --ci-run-id "${GITHUB_RUN_ID}" \
              --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --generated-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --reason-code "$1" \
              --authority-bundle "${authority_bundle_path}" \
              --output "${receipt_path}"
          }
          if ! docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/output/build-evidence:/output" \
            "${scanner_image}" image \
            --exit-code 0 \
            --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output "/output/${{ matrix.service }}-trivy.json" \
            "${{ steps.meta.outputs.image_ref }}@${{ steps.digest.outputs.image_digest }}"; then
            write_unavailable_receipt trivy_scan_failed
            exit 0
          fi
          if ! python -m scripts.release.image_scan_policy evaluate \
            --report "${report_path}" \
            --service "${{ matrix.service }}" \
            --image-ref "${{ steps.meta.outputs.image_ref }}" \
            --image-digest "${{ steps.digest.outputs.image_digest }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --scanner-name trivy \
            --scanner-version 0.56.2 \
            --scanner-image "${scanner_image}" \
            --scan-timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --kev-catalog "${kev_catalog_path}" \
            --kev-fetched-at "${kev_fetched_at}" \
            --authority-bundle "${authority_bundle_path}" \
            --exception-register "contracts/security/vulnerability-exception-register.v1.json" \
            --exception-schema "${exception_schema_path}" \
            --output "${receipt_path}"; then
            write_unavailable_receipt evidence_evaluation_failed
          fi
      - name: Upload image scan policy receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-policy-${{ matrix.service }}-attempt-${{ github.run_attempt }}
          path: output/build-evidence/${{ matrix.service }}-image-scan-policy.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce image vulnerability and secret policy
        run: |
          python -m scripts.release.image_scan_policy enforce \
            --receipt "output/build-evidence/${{ matrix.service }}-image-scan-policy.json" \
            --report "output/build-evidence/${{ matrix.service }}-trivy.json" \
            --kev-catalog "output/vulnerability-authority/cisa-kev.json" \
            --authority-bundle "output/vulnerability-authority/vulnerability-authority-bundle.json" \
            --exception-register "contracts/security/vulnerability-exception-register.v1.json" \
            --exception-schema "output/vulnerability-authority/vulnerability-exception-register.schema.json" \
            --expected-service "${{ matrix.service }}" \
            --expected-image-ref "${{ steps.meta.outputs.image_ref }}" \
            --expected-image-digest "${{ steps.digest.outputs.image_digest }}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-git-commit-sha "${GITHUB_SHA}" \
            --expected-ci-run-id "${GITHUB_RUN_ID}" \
            --expected-ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --enforced-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Export image SBOM
        shell: bash
        run: |
          docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/output/build-evidence:/output" \
            aquasec/trivy:0.56.2 image \
            --format cyclonedx \
            --output "/output/${{ matrix.service }}-sbom.cdx.json" \
            "${{ steps.meta.outputs.image_ref }}@${{ steps.digest.outputs.image_digest }}"
      - name: Sign image digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.meta.outputs.image_ref }}@${{ steps.digest.outputs.image_digest }}"
      - name: Verify image signature identity
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          certificate_issuer="https://token.actions.githubusercontent.com"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image-release.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "${certificate_issuer}" \
            --output json \
            "${{ steps.meta.outputs.image_ref }}@${{ steps.digest.outputs.image_digest }}" \
            > "output/build-evidence/${{ matrix.service }}-signature-verification.json"
      - name: Attest source-bound SLSA provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          predicate="output/build-evidence/${{ matrix.service }}-slsa-provenance-predicate.json"
          python -m scripts.release.write_slsa_provenance_predicate \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-url "${{ steps.meta.outputs.repo_url }}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --workflow-ref "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image-release.yml@${GITHUB_REF}" \
            --service "${{ matrix.service }}" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --buildx-metadata "output/build-evidence/${{ matrix.service }}-buildx-metadata.json" \
            --output "${predicate}"
          cosign attest --yes --type slsaprovenance --predicate "${predicate}" \
            "${{ steps.meta.outputs.image_ref }}@${{ steps.digest.outputs.image_digest }}"
      - name: Verify signed provenance identity
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          certificate_issuer="https://token.actions.githubusercontent.com"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image-release.yml@${GITHUB_REF}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "${certificate_issuer}" \
            --output json \
            "${{ steps.meta.outputs.image_ref }}@${{ steps.digest.outputs.image_digest }}" \
            > "output/build-evidence/${{ matrix.service }}-provenance-verification.json"
      - name: Re-verify scan receipt at manifest boundary
        run: |
          python -m scripts.release.image_scan_policy enforce \
            --receipt "output/build-evidence/${{ matrix.service }}-image-scan-policy.json" \
            --report "output/build-evidence/${{ matrix.service }}-trivy.json" \
            --kev-catalog "output/vulnerability-authority/cisa-kev.json" \
            --authority-bundle "output/vulnerability-authority/vulnerability-authority-bundle.json" \
            --exception-register "contracts/security/vulnerability-exception-register.v1.json" \
            --exception-schema "output/vulnerability-authority/vulnerability-exception-register.schema.json" \
            --expected-service "${{ matrix.service }}" \
            --expected-image-ref "${{ steps.meta.outputs.image_ref }}" \
            --expected-image-digest "${{ steps.digest.outputs.image_digest }}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-git-commit-sha "${GITHUB_SHA}" \
            --expected-ci-run-id "${GITHUB_RUN_ID}" \
            --expected-ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --enforced-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Write image release manifest
        run: |
          python scripts/release/write_image_release_manifest.py \
            --service "${{ matrix.service }}" \
            --image-name "${{ matrix.image_name }}" \
            --image-ref "${{ steps.meta.outputs.image_ref }}" \
            --image-tag "${{ steps.meta.outputs.image_tag }}" \
            --image-digest "${{ steps.digest.outputs.image_digest }}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --git-branch "${GITHUB_REF_NAME}" \
            --image-version "${GITHUB_SHA}" \
            --build-timestamp "${{ steps.meta.outputs.build_timestamp }}" \
            --repo-url "${{ steps.meta.outputs.repo_url }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --ci-pipeline-run-id "${GITHUB_RUN_ID}" \
            --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --scan-receipt "output/build-evidence/${{ matrix.service }}-image-scan-policy.json" \
            --authority-bundle "output/vulnerability-authority/vulnerability-authority-bundle.json" \
            --sbom "output/build-evidence/${{ matrix.service }}-sbom.cdx.json" \
            --signature-verification "output/build-evidence/${{ matrix.service }}-signature-verification.json" \
            --provenance-verification "output/build-evidence/${{ matrix.service }}-provenance-verification.json" \
            --certificate-issuer "https://token.actions.githubusercontent.com" \
            --certificate-subject-pattern "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image-release.yml@${GITHUB_REF}" \
            --base-lifecycle-inventory "contracts/security/base-image-lifecycle-inventory.v1.json" \
            --base-manifest-evidence "contracts/security/base-image-manifest-evidence.v1.json" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --output "output/build-evidence/${{ matrix.service }}-image-release-manifest.json"
      - name: Upload image release evidence
        uses: actions/upload-artifact@v7
        with:
          name: image-release-${{ matrix.service }}
          path: |
            output/build-evidence/${{ matrix.service }}-buildx-metadata.json
            output/build-evidence/${{ matrix.service }}-digest-ref.txt
            output/build-evidence/${{ matrix.service }}-sbom.cdx.json
            output/build-evidence/${{ matrix.service }}-signature-verification.json
            output/build-evidence/${{ matrix.service }}-slsa-provenance-predicate.json
            output/build-evidence/${{ matrix.service }}-provenance-verification.json
            output/build-evidence/${{ matrix.service }}-image-release-manifest.json
          if-no-files-found: error
          retention-days: 90

  diagnose-images:
    name: Image Release / Diagnose ${{ matrix.service }}
    needs: [prepare-image-matrix, prepare-vulnerability-authority]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-image-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Download workflow vulnerability authority
        uses: actions/download-artifact@v8
        with:
          name: vulnerability-authority-attempt-${{ github.run_attempt }}
          path: output/vulnerability-authority
      - name: Resolve diagnostic image metadata
        id: meta
        shell: bash
        run: |
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          image_ref="lotus-core-diagnostic/${{ matrix.image_name }}:${GITHUB_SHA}"
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          mkdir -p output/build-evidence
          {
            echo "build_timestamp=${build_timestamp}"
            echo "image_ref=${image_ref}"
            echo "repo_url=${repo_url}"
          } >> "$GITHUB_OUTPUT"
      - name: Build diagnostic image locally
        shell: bash
        run: |
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ steps.meta.outputs.image_ref }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.ref.name=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.created=${{ steps.meta.outputs.build_timestamp }}" \
            --label "org.opencontainers.image.source=${{ steps.meta.outputs.repo_url }}" \
            --label "org.opencontainers.image.version=${GITHUB_SHA}" \
            --label "org.opencontainers.image.ci.run_id=${GITHUB_RUN_ID}" \
            --build-arg "LOTUS_GIT_COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "LOTUS_GIT_BRANCH=${GITHUB_REF_NAME}" \
            --build-arg "LOTUS_BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}" \
            --build-arg "LOTUS_REPO_URL=${{ steps.meta.outputs.repo_url }}" \
            --build-arg "LOTUS_IMAGE_VERSION=${GITHUB_SHA}" \
            --build-arg "LOTUS_IMAGE_DIGEST=diagnostic-local-image-id" \
            --build-arg "LOTUS_CI_RUN_ID=${GITHUB_RUN_ID}" \
            --provenance=false \
            --sbom=false \
            --load \
            .
      - name: Resolve exact local image ID
        id: digest
        shell: bash
        run: |
          image_digest="$(docker image inspect --format '{{.Id}}' '${{ steps.meta.outputs.image_ref }}')"
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Diagnostic build did not produce an exact local image ID" >&2
            exit 1
          fi
          echo "image_digest=${image_digest}" >> "$GITHUB_OUTPUT"
      - name: Generate diagnostic image scan receipt
        shell: bash
        run: |
          scanner_image="aquasec/trivy:0.56.2"
          report_path="output/build-evidence/${{ matrix.service }}-diagnostic-trivy.json"
          receipt_path="output/build-evidence/${{ matrix.service }}-diagnostic-image-scan-policy.json"
          authority_dir="output/vulnerability-authority"
          authority_bundle_path="${authority_dir}/vulnerability-authority-bundle.json"
          kev_catalog_path="${authority_dir}/cisa-kev.json"
          exception_schema_path="${authority_dir}/vulnerability-exception-register.schema.json"
          python -m scripts.release.vulnerability_authority_bundle verify \
            --bundle "${authority_bundle_path}" \
            --kev-catalog "${kev_catalog_path}" \
            --exception-schema "${exception_schema_path}" \
            --repository "${GITHUB_REPOSITORY}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --verified-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          kev_fetched_at="$(python -c "import json, pathlib; print(json.loads(pathlib.Path('${authority_bundle_path}').read_text())['cisa_kev']['fetched_at_utc'])")"
          write_unavailable_receipt() {
            python -m scripts.release.image_scan_policy unavailable \
              --service "${{ matrix.service }}" \
              --image-ref "${{ steps.meta.outputs.image_ref }}" \
              --image-digest "${{ steps.digest.outputs.image_digest }}" \
              --repository "${GITHUB_REPOSITORY}" \
              --git-commit-sha "${GITHUB_SHA}" \
              --ci-run-id "${GITHUB_RUN_ID}" \
              --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --generated-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --reason-code "$1" \
              --authority-bundle "${authority_bundle_path}" \
              --evidence-posture diagnostic \
              --output "${receipt_path}"
          }
          if ! docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/output/build-evidence:/output" \
            "${scanner_image}" image \
            --image-src docker \
            --exit-code 0 \
            --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output "/output/${{ matrix.service }}-diagnostic-trivy.json" \
            "${{ steps.meta.outputs.image_ref }}"; then
            write_unavailable_receipt trivy_scan_failed
            exit 0
          fi
          if ! python -m scripts.release.image_scan_policy evaluate \
            --report "${report_path}" \
            --service "${{ matrix.service }}" \
            --image-ref "${{ steps.meta.outputs.image_ref }}" \
            --image-digest "${{ steps.digest.outputs.image_digest }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --ci-run-id "${GITHUB_RUN_ID}" \
            --ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --scanner-name trivy \
            --scanner-version 0.56.2 \
            --scanner-image "${scanner_image}" \
            --scan-timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --kev-catalog "${kev_catalog_path}" \
            --kev-fetched-at "${kev_fetched_at}" \
            --authority-bundle "${authority_bundle_path}" \
            --exception-register "contracts/security/vulnerability-exception-register.v1.json" \
            --exception-schema "${exception_schema_path}" \
            --evidence-posture diagnostic \
            --output "${receipt_path}"; then
            write_unavailable_receipt evidence_evaluation_failed
          fi
      - name: Upload diagnostic image scan receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-image-scan-policy-${{ matrix.service }}-attempt-${{ github.run_attempt }}
          path: output/build-evidence/${{ matrix.service }}-diagnostic-image-scan-policy.json
          if-no-files-found: error
          retention-days: 30
      - name: Report diagnostic image policy result
        run: |
          python -m scripts.release.image_scan_policy enforce \
            --receipt "output/build-evidence/${{ matrix.service }}-diagnostic-image-scan-policy.json" \
            --report "output/build-evidence/${{ matrix.service }}-diagnostic-trivy.json" \
            --kev-catalog "output/vulnerability-authority/cisa-kev.json" \
            --authority-bundle "output/vulnerability-authority/vulnerability-authority-bundle.json" \
            --exception-register "contracts/security/vulnerability-exception-register.v1.json" \
            --exception-schema "output/vulnerability-authority/vulnerability-exception-register.schema.json" \
            --expected-service "${{ matrix.service }}" \
            --expected-image-ref "${{ steps.meta.outputs.image_ref }}" \
            --expected-image-digest "${{ steps.digest.outputs.image_digest }}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-git-commit-sha "${GITHUB_SHA}" \
            --expected-ci-run-id "${GITHUB_RUN_ID}" \
            --expected-ci-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-evidence-posture diagnostic \
            --enforced-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
